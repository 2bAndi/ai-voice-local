; Template - copy to <project>\config.ini (git-ignored; setup.ps1 does this).
; Legacy fallback location: %USERPROFILE%\Code\voiceagent-local\config.ini

[sip]
; FRITZ!Box IP phone ("Telephony -> Telephony Devices -> LAN/Wi-Fi IP phone")
server = 192.168.0.1
port = 5060
user = AiVoice01
password = PUT_THE_IP_PHONE_PASSWORD_HERE

[models]
; Defaults are tuned for one RTX 3090 (24 GB). Everything here is optional.
; LLM via Ollama. qwen3.8:27b = Q4_K_M, ~18 GB VRAM, ~30 tok/s. Smaller/faster: qwen3.5:9b
llm = qwen3.8:27b
; faster-whisper model + compute type. large-v3-turbo/float16 ~1.8 GB. More accurate but
; 3-4x slower: large-v3. On a smaller card: int8_float16.
stt = large-v3-turbo
stt_compute = float16
stt_beam = 5
; Streaming STT backend (agent/stt_stream.py) - the STT swap point:
;   whisper = faster-whisper driven as a stream (multilingual, GPU, LocalAgreement partials)
;   sherpa  = sherpa-onnx streaming Zipformer (true streaming model, CPU, English only)
stt_backend = whisper
; whisper backend: seconds of new audio between partial decodes
stt_interval = 0.7
; pause (ms) after which the utterance is final (Silero VAD, both backends)
endpoint_ms = 600
; model files (setup.ps1 downloads them into models\)
vad_model = models/silero_vad.onnx
sherpa_model = models/sherpa-onnx-streaming-zipformer-en-2023-06-26
; Ollama context window (tokens). 8192 is plenty for one phone dialog.
num_ctx = 8192

[agent]
; en | de | da  - prompt language, Piper voice and STT language (see LANG_CFG in call_agent.py)
language = en
; Detect the caller's language on the first utterances and switch voice + reply language
; for the rest of the call (needs the Piper voice of that language in .\voices). The greeting
; is always spoken in the configured language.
language_detect = true
; Start the LLM turn already on a stable partial transcript (when the caller pauses); the
; turn is discarded if the final transcript differs. Speech and tool calls are held until then.
speculative = true
; Non-English callers are translated to English by whisper while they speak (task=translate), so
; orchestration, confirm gate and guardrails work in one language. Replies stay in the caller's language.
canonical_english = true

[glassbox]
; Live architecture page served by the agent process (http://<agent-ip>:port). 0 disables it.
port = 8080
